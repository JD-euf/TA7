<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#90D5FF;
}

nav ul{
    list-style:none;
    display:flex;
    justify-content:center;
}

nav ul li{
    padding:15px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

main{
    padding:20px;
    min-height:300px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}

@media (max-width: 768px){
    nav ul{
        flex-direction:column;
        text-align:center;
    }
}

@media (max-width: 480px){
    header{
        font-size:18px;
    }

    main{
        padding:10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>My website</h1>
</header>

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<main>
    <h2>Welcome</h2>
    <p>
        This is a webpage that adjusts for different device screens using CSS media queries.
    </p>
</main>

<footer>
    <p>&copy; 2025 Dustin Profeta</p>
</footer>

</body>
</html>
